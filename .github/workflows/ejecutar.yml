name: Procesar Extractos Bancarios Drive

on:
  workflow_dispatch:
  schedule:
    - cron: '0 5 * * *'

jobs:
  procesar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v3

      - name: Configurar versión de Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Instalar librerías requeridas
        run: |
          python -m pip install --upgrade pip
          pip install google-genai pydantic pikepdf gspread google-api-python-client google-auth

      - name: Ejecutar script extractor
        env:
          PDF_PASSWORD: ${{ secrets.PDF_PASSWORD }}
          GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python procesar_extractos.py
